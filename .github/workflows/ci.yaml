name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync
    - name: Lint with Ruff
      run: uv run ruff check sqlitey tests
    - name: Check formatting
      run: uv run ruff format --check sqlitey tests
    - name: Run Mypy
      run: uv run mypy sqlitey tests
    - name: Test suite
      run: uv run pytest --cov=sqlitey tests
